<style>
:root{
  --cream:#edf2eb;--warm-white:#fafcf8;--sage:#78927b;--sage-dark:#365b46;--sage-mid:#52775c;
  --sage-light:#d2dfd1;--sage-pale:#e4ece2;--forest:#244b38;--moss:#60805f;--leaf:#88a487;
  --terracotta:#c97a72;--terracotta-soft:#f0ddd9;--sand-light:#dce6d8;--trail-sand:#f6f3ec;
  --ink:#2a332c;--ink-soft:#4a554c;--ink-muted:#5f6a60;--border:rgba(61,90,71,.14);
  --shadow:0 18px 50px rgba(61,90,71,.12);--radius:18px;
  --font-serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --font-sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --observer:#3d6f7c;--adaptor:#52775c;--explorer:#b0675e;
  --assets:"https://sensoryapp.streblainnovations.com/assets/";
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ink);background:var(--cream);overflow-x:hidden;display:flex;flex-direction:column}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #1f6a8a;outline-offset:3px;border-radius:12px}

/* Calm mountain background (same layers as the main app) */
.page-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse 80% 45% at 20% 0%,rgba(104,139,151,.18) 0%,transparent 58%),linear-gradient(180deg,#dce7e4 0%,var(--cream) 45%,#dbe6d9 100%)}
.page-bg__m{position:absolute;left:-8%;width:116%;bottom:0;clip-path:polygon(0 100%,0 66%,8% 58%,15% 70%,23% 46%,30% 65%,39% 36%,48% 63%,58% 44%,66% 68%,76% 49%,84% 64%,92% 42%,100% 62%,100% 100%)}
.page-bg__m--far{height:42vh;background:rgba(94,125,125,.08)}
.page-bg__m--mid{height:31vh;background:rgba(71,107,81,.09);transform:scaleX(-1)}
.page-bg__m--near{height:21vh;bottom:-1px;background:rgba(36,75,56,.08)}
.page-bg__trail{position:absolute;bottom:-8vh;left:48%;width:11vw;min-width:80px;height:35vh;border-radius:50%;border-left:2px solid rgba(250,252,248,.65);transform:rotate(9deg)}

.site-header{padding:calc(.7rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) .7rem calc(1rem + env(safe-area-inset-left));display:flex;justify-content:center}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:inherit}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.brand-name{margin:0;font-family:var(--font-serif);font-weight:700;font-size:1.08rem;color:var(--forest);line-height:1.2}
.brand-tag{margin:0;font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}

main{flex:1;width:min(560px,100%);margin:0 auto;padding:0 calc(.75rem + env(safe-area-inset-right)) 1.5rem calc(.75rem + env(safe-area-inset-left))}
body.is-results main{width:min(720px,100%)}
.card{position:relative;background:var(--warm-white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-body{padding:1.4rem 1.25rem 1.5rem}
@media (min-width:480px){.card-body{padding:1.9rem 2rem 2rem}}

h1,h2,h3{font-family:var(--font-serif);color:var(--forest);line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,6.4vw,2.1rem)}
h2{font-size:clamp(1.3rem,5.4vw,1.6rem)}
h3{font-size:1.08rem}
[tabindex="-1"]:focus{outline:none}
.kicker{margin:0 0 .4rem;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4f6f58}
.lead{color:var(--ink-soft);margin:.7rem 0 0}
.small{font-size:.9rem;color:var(--ink-muted)}

.welcome-body{padding-top:1rem}
.welcome-body .actions{margin-top:1rem}
.hero .kicker{color:rgba(255,255,255,.9)}
.hero p{margin:.5rem 0 0;color:rgba(255,255,255,.92)}
.pill-row{display:flex;flex-wrap:wrap;gap:.45rem;margin:1.1rem 0 0;padding:0;list-style:none}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .75rem;border-radius:999px;background:var(--sage-pale);color:var(--sage-dark);font-size:.86rem;font-weight:600}
.note{margin:1.1rem 0 0;padding:.8rem 1rem;border-radius:14px;background:#f6f3ec;border:1px solid var(--border);font-size:.92rem;color:var(--ink-soft)}

.struggles{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.struggle{display:flex;gap:.7rem;align-items:center;padding:.6rem .8rem;background:#fff;border:1px solid var(--border);border-radius:14px;font-family:var(--font-serif);font-size:.98rem;line-height:1.32;color:var(--forest)}
.struggle__ic{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sage-pale);color:var(--sage-dark)}
.turn{margin:1rem 0 0;font-family:var(--font-serif);font-size:1.22rem;font-weight:700;color:var(--forest);line-height:1.3}
.free{display:flex;justify-content:center;margin:.9rem 0 0}
.free span{display:inline-block;padding:.55rem 1.1rem;border-radius:999px;background:var(--sage-pale);color:var(--forest);font-weight:700;font-size:1.02rem;border:1.5px solid rgba(82,119,92,.35)}
.intro{margin:0 0 1.3rem;padding:1.1rem 1.1rem 1.2rem;border-radius:16px;background:#f6f3ec;border:1px solid var(--border)}
.intro p{margin:.5rem 0 0;color:var(--ink-soft)}
.legend{display:grid;gap:.4rem;margin:.9rem 0 0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:.6rem;padding:.5rem .75rem;border-radius:12px;font-size:.9rem;line-height:1.3}
.legend b{flex:none;width:8.6rem;font-size:.92rem}
@media (min-width:600px){.legend{grid-template-columns:repeat(3,1fr)}.legend li{display:block;text-align:center}.legend b{display:block;width:auto}}
.cta-lead{margin:1.2rem 0 0;font-weight:500;color:#fff;line-height:1.5}
/* Buttons (pill buttons from the main app) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:52px;padding:.8rem 1.4rem;font-weight:600;font-size:1.02rem;border-radius:999px;border:none;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--forest),var(--sage-mid));box-shadow:0 8px 20px rgba(74,107,85,.3)}
.btn-primary:hover{background:linear-gradient(135deg,var(--sage-dark),var(--sage))}
.btn-secondary{color:var(--sage-dark);background:transparent;border:1.5px solid rgba(61,90,71,.3)}
.btn-secondary:hover{background:var(--sage-pale);border-color:var(--sage)}
.btn-wa{color:#fff;background:#1f7a4d;box-shadow:0 8px 20px rgba(31,122,77,.28)}
.btn-wa:hover{background:#18663f}
.btn-block{width:100%}
.btn svg{flex:none}
.actions{display:grid;gap:.7rem;margin-top:1.4rem}

/* Who-is-it-for choices */
.choices{display:grid;gap:.75rem;margin:1.2rem 0 0;padding:0;list-style:none}
.choice{width:100%;display:flex;align-items:center;gap:.9rem;padding:.75rem;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:16px;cursor:pointer;min-height:84px;transition:border-color .2s,background .2s,transform .15s}
.choice:hover{border-color:var(--sage);background:var(--sage-pale)}
.choice:active{transform:scale(.99)}
.choice img{width:66px;height:66px;border-radius:12px;object-fit:cover;flex:none;background:var(--sage-light)}
.choice__t{display:block;font-family:var(--font-serif);font-weight:700;color:var(--forest);font-size:1.02rem;line-height:1.25}
.choice__d{display:block;font-size:.9rem;color:var(--ink-muted);line-height:1.35;margin-top:.15rem}

.count{font-size:.9rem;color:var(--ink-muted);font-weight:600}
.trail-progress{width:100%;height:auto;display:block;margin:.1rem 0 .3rem;overflow:visible}

.trail-progress .dot{fill:var(--warm-white);stroke:var(--sand-light);stroke-width:2.5;transition:all .3s}
.trail-progress .dot.done{fill:var(--sage-light);stroke:var(--sage-mid)}
.trail-progress .dot.now{fill:var(--sage-mid);stroke:var(--forest);r:7}
.trail-progress .peak{fill:var(--forest);opacity:.85}
.sense-tag{display:inline-flex;align-items:center;gap:.4rem;margin:.9rem 0 .6rem;padding:.3rem .75rem;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sage-pale);color:var(--sage-dark)}
.qtext{font-size:clamp(1.2rem,5vw,1.42rem);line-height:1.35}
.scale{display:grid;gap:.55rem;margin:1.3rem 0 0;padding:0;list-style:none}
.opt{width:100%;min-height:56px;display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;background:#fff;border:1.5px solid var(--border);border-radius:14px;cursor:pointer;text-align:left;font-size:1.04rem;font-weight:500;color:var(--ink);transition:border-color .15s,background .15s,transform .15s;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:var(--sage);background:var(--sage-pale)}
.opt:active{transform:scale(.99)}
.opt__dots{display:inline-flex;gap:3px;flex:none;width:52px}

.opt__dots i.on{background:var(--sage-mid)}

.hint{margin:1rem 0 0;font-size:.88rem;color:var(--ink-muted);text-align:center}

.res-tag{display:block;margin:.4rem 0 0;font-size:1rem;font-weight:600;color:var(--sage-dark)}

.mixed{margin:.9rem 0 0;font-size:.95rem;color:var(--ink-soft)}

.tips{display:grid;gap:.7rem;margin:1rem 0 0;padding:0;list-style:none;counter-reset:tip}
.tip{position:relative;padding:.85rem 1rem .85rem 3.1rem;background:#fff;border:1px solid var(--border);border-radius:14px;counter-increment:tip}

.teaser h3{color:#fff;font-size:1.2rem}

.teaser .btn-secondary{color:#fff;border-color:rgba(255,255,255,.55)}

.share-row{margin-top:1.2rem}
.toast{margin:.6rem 0 0;min-height:1.3em;text-align:center;font-weight:600;color:var(--sage-dark);font-size:.95rem}
.disclaimer{margin:1.2rem 0 0;font-size:.88rem;color:var(--ink-muted);text-align:center}
.restart{display:block;margin:1rem auto 0;background:none;border:none;color:var(--sage-dark);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 1rem}

.site-footer{padding:1rem calc(1rem + env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));text-align:center;font-size:.85rem;color:var(--ink-soft);background:rgba(248,251,248,.72);border-top:1px solid var(--border)}

  function announce(msg) { live.textContent = ""; setTimeout(function () { live.textContent = msg; }, 40); }

  function render() {
    document.body.classList.toggle("is-results", state.step === "results");
    if (state.step === "welcome") renderWelcome();
    else if (state.step === "who") renderWho();
    else if (state.step === "q") renderQuestion();
    else renderResults();
    focusHeading();
  }

  var LEGEND = '<ul class="legend" aria-label="The three sensory styles">' +
    '<li class="lean-observer"><b>Sensory Observer</b>Very aware, can get overwhelmed quickly</li>' +
    '<li class="lean-adaptor"><b>Sensory Adaptor</b>Balanced in the middle</li>' +
    '<li class="lean-explorer"><b>Sensory Explorer</b>Can tolerate a lot of sensory input</li></ul>';

  function renderWelcome() {
    app.innerHTML =
      '<section class="card" aria-labelledby="t-welcome">' +
        '<div class="hero hero--welcome"><div><p class="kicker">Free 2-minute snapshot</p><h1 id="t-welcome" data-focus>Feeling overwhelmed, anxious and regularly overstimulated?</h1></div></div>' +
        '<div class="card-body welcome-body">' +
          '<ul class="struggles" aria-label="Does this sound familiar?">' +
            '<li class="struggle">' + '<span class="struggle__ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>' + '<span>Feeling overwhelmed by noise, meetings and screens?</span></li>' +
            '<li class="struggle">' + '<span class="struggle__ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.6 12 20 12 20Z"/></svg></span>' + '<span>Snapping at the people you love, or needing quiet when your partner wants some quality time?</span></li>' +
            '<li class="struggle">' + '<span class="struggle__ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9a5 5 0 0 1 10 0v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9Z"/><path d="M10 4.5V3h4v1.5M9 14h6v4H9z"/></svg></span>' + '<span>Watching your child grow more anxious and struggle to concentrate at school?</span></li>' +
          '</ul>' +
          '<p class="lead">Take this quick snapshot to see how your senses shape your day, and learn how to calm your nervous system.</p>' +
          '<div class="free"><span>Free · 2 minutes · no sign-up</span></div>' +
          '<div class="actions"><button type="button" class="btn btn-primary btn-block" data-act="start">Start the snapshot ' + ARROW + '</button></div>' +
          '<p class="small" style="text-align:center;margin:.8rem 0 0">Not a diagnosis. Nothing is saved or sent.</p>' +
        '</div>' +
      '</section>';
  }

  function renderWho() {
    var items = Object.keys(CONTEXTS).map(function (k) {
      var c = CONTEXTS[k];
      return '<li><button type="button" class="choice" data-act="ctx" data-ctx="' + k + '">' +
        '<img src="' + ASSETS + c.img + '" alt="" width="66" height="66" loading="eager" />' +
        '<span><span class="choice__t">' + esc(c.title) + '</span><span class="choice__d">' + esc(c.desc) + '</span></span>' +
        '<span class="choice__arrow">' + ARROW + '</span></button></li>';
    }).join("");
    app.innerHTML =
      '<section class="card" aria-labelledby="t-who"><div class="card-body">' +
        '<div class="qtop"><button type="button" class="back" data-act="back"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button></div>' +
        '<div class="intro"><p class="kicker">Before you start</p><h2 id="t-who" data-focus>What are your sensory needs?</h2>' +
          '<p>We take in sensory information constantly \u2013 sound, light, smells and more. Sometimes we enjoy this sensory input, and at other times it can feel overwhelming.</p>' +
          '<p>We all have different sensory preferences \u2013 almost like different tastes in music. Some love rock, others love pop; neither is right or wrong, it\u2019s just a personal preference. By understanding your sensory needs, you can prevent getting overwhelmed and support yourself better.</p>' +
          LEGEND + '</div>' +
        '<h3>Who is this snapshot for?</h3>' +
        '<p class="small" style="margin:.3rem 0 0">We\u2019ll word the questions to fit.</p>' +
        '<ul class="choices">' + items + '</ul>' +
      '</div></section>';
  }

  function trailSvg(current, total) {
    // winding trail with a marker per question; fill shows how far along you are
    return '<svg class="trail-progress" viewBox="0 0 320 54" role="img" aria-label="Question ' + (current + 1) + ' of ' + total + '">' +
      '<defs><linearGradient id="trailGrad" x1="0" x2="1"><stop offset="0" stop-color="#244b38"/><stop offset=".6" stop-color="#365b46"/><stop offset="1" stop-color="#52775c"/></linearGradient></defs>' +
      '<path id="trailPath" class="base" d="M10 40 C 45 40, 50 16, 85 18 S 125 44, 160 38 S 200 12, 235 16 S 275 40, 300 26" />' +
      '<path class="fill" d="M10 40 C 45 40, 50 16, 85 18 S 125 44, 160 38 S 200 12, 235 16 S 275 40, 300 26" />' +
      '<g class="dots"></g>' +
      '<path class="peak" d="M296 22 L304 10 L309 16 L313 9 L318 22 Z" opacity=".75" />' +
      '</svg>';
  }
  function layoutTrail(current, total) {
    var svg = app.querySelector(".trail-progress"); if (!svg) return;
    var base = svg.querySelector("#trailPath"), fill = svg.querySelector(".fill"), g = svg.querySelector(".dots");
    var L = base.getTotalLength();
    var html = "";
    for (var i = 0; i < total; i++) {
      var p = base.getPointAtLength(L * i / (total - 1));
      var cls = i < current ? "dot done" : (i === current ? "dot now" : "dot");
      html += '<circle class="' + cls + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (i === current ? 7 : 5) + '" />';
    }
    g.innerHTML = html;
    fill.style.strokeDasharray = L;
    var prev = state._lastFrac == null ? 0 : state._lastFrac;
    var frac = current / (total - 1);
    fill.style.strokeDashoffset = L * (1 - prev);
    fill.getBoundingClientRect();
    fill.style.strokeDashoffset = L * (1 - frac);
    state._lastFrac = frac;
  }

  function renderQuestion() {
    var total = QUESTIONS.length, i = state.idx, q = QUESTIONS[i];
    var chosen = state.answers[i];
    var opts = SCALE.map(function (label, v) {
      var dots = ""; for (var d = 0; d < 5; d++) dots += '<i class="' + (d <= v ? "on" : "") + '"></i>';
      return '<li><button type="button" class="opt" data-act="ans" data-v="' + (v + 1) + '" aria-pressed="' + (chosen === v + 1 ? "true" : "false") + '"><span class="opt__dots" aria-hidden="true">' + dots + '</span>' + label + '</button></li>';
    }).join("");
    app.innerHTML =
      '<section class="card" aria-labelledby="t-q"><div class="card-body">' +
        '<div class="qtop"><button type="button" class="back" data-act="back"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>' +
        '<span class="count" aria-hidden="true">' + (i + 1) + ' / ' + total + '</span></div>' +
        trailSvg(i, total) +
        '<span class="sense-tag">' + icon(q.sense, 18) + esc(SENSES[q.sense].name) + '</span>' +
        '<h2 id="t-q" class="qtext" data-focus>' + esc(q[state.ctx]) + '</h2>' +
        '<ul class="scale" role="group" aria-labelledby="t-q">' + opts + '</ul>' +
        '<p class="hint">Go with your first instinct. There are no right or wrong answers.</p>' +
      '</div></section>';
    layoutTrail(i, total);
    announce("Question " + (i + 1) + " of " + total + ", " + SENSES[q.sense].name);
  }

  // ---------- scoring ----------
  function score() {
    var per = {};
    Object.keys(SENSES).forEach(function (k) { per[k] = { a: 0, s: 0 }; });
    QUESTIONS.forEach(function (q, i) { per[q.sense][q.dir] = state.answers[i] || 3; });
    var sum = 0, senses = [];
    Object.keys(per).forEach(function (k) {
      var lean = per[k].s - per[k].a; // -4 (very aware) .. +4 (tolerates a lot)
      sum += lean;
      senses.push({ key: k, lean: lean, zone: lean <= -2 ? "observer" : (lean >= 2 ? "explorer" : "adaptor") });
    });
    var overall = sum <= -8 ? "observer" : (sum >= 8 ? "explorer" : "adaptor");
    return { senses: senses, sum: sum, overall: overall };
  }
  function pickTips(res) {
    var ctx = state.ctx;
    var ranked = res.senses.slice().filter(function (s) { return s.lean !== 0; })
      .sort(function (a, b) { return Math.abs(b.lean) - Math.abs(a.lean); });
    var tips = [];
    ranked.forEach(function (s) {
      if (tips.length >= 3) return;
      var dir = s.lean < 0 ? "down" : "up";
      tips.push({ title: SENSES[s.key].name + (dir === "down" ? ": turn it down" : ": turn it up"), text: TIPS[s.key][dir][ctx] });
    });
    if (tips.length < 3) tips.push({ title: "Find your balance", text: BALANCED_TIP[ctx] });
    return tips.slice(0, 3);
  }

  function renderResults() {
    var res = score(), ctx = state.ctx, ch = CHAR[res.overall], child = ctx === "child";
    var headline = (child ? "Your child is a " : "You\u2019re a ") + ch.name;
    var where = { work: "at work", couple: "at home", child: "at school" }[ctx];
    var lean = { observer: "Observer", adaptor: "Adaptor", explorer: "Explorer" };
    var stops = res.senses.map(function (s) {
      var pct = Math.round(((s.lean + 4) / 8) * 84 + 8); // keep marker inside the track
      return '<li class="stop"><span class="stop__icon">' + icon(s.key, 22) + '</span><div>' +
        '<div class="stop__head"><span class="stop__name">' + esc(SENSES[s.key].name) + '</span><span class="stop__lean lean-' + s.zone + '">Sensory ' + lean[s.zone] + '</span></div>' +
        '<div class="track" aria-hidden="true"><span class="track__marker" style="left:' + pct + '%"></span></div>' +
        '<div class="track__labels" aria-hidden="true"><span>Observer</span><span>Adaptor</span><span>Explorer</span></div></div></li>';
    }).join("");
    var zones = res.senses.map(function (s) { return s.zone; });
    var mixed = zones.indexOf("observer") > -1 && zones.indexOf("explorer") > -1;
    var tips = pickTips(res).map(function (t) { return '<li class="tip"><strong>' + esc(t.title) + '</strong>' + esc(t.text) + '</li>'; }).join("");
    var adds = [
      child ? "Ideas you can share with your child\u2019s teacher to support them in class"
            : (ctx === "couple" ? "Both of your profiles side by side, so you can see where your needs meet and where they clash"
                                : "A work setup and burnout plan that fits you"),
      "A conversation with Occupational Therapist Cayley about what your results mean for everyday life"
    ].map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    var who = child ? "my child at school" : CONTEXTS[ctx].label;
    var msg = "Hi Cayley, I just did the free Sensory Snapshot (" + who + ") and got " + ch.name + ". I'd like to find out about the full Soulful Sensory Screening.";
    var shareLabel = CONTEXTS[ctx].share;

    app.innerHTML =
      '<section class="card" aria-labelledby="t-res">' +
        '<div class="res-wrap"><figure class="res-hero res-hero--' + res.overall + '">' +
          '<img src="' + ASSETS + ch.img + '" alt="' + esc(ch.alt + '. Badge: ' + ch.quote) + '" width="' + ch.w + '" height="' + ch.h + '" />' +
          '</figure>' +
        '<div class="card-body">' +
          '<p class="kicker">Your sensory trail snapshot</p>' +
          '<h2 id="t-res" data-focus>' + esc(headline) + '</h2>' +
          '<span class="res-tag">' + esc(ch.tag) + '</span>' +
          '<p class="res-summary">' + esc(SUMMARY[res.overall][ctx]) + '</p>' +
        '</div></div>' +
        '<div class="card-body" style="padding-top:0">' +
          '<div class="section"><h3>' + PEAKS + (child ? 'Your child\u2019s trail, sense by sense' : 'Your trail, sense by sense') + '</h3>' +
            '<p class="small" style="margin:.4rem 0 0">Each marker shows where ' + (child ? 'your child sits' : 'you sit') + ' for each sense ' + where + ':</p>' + LEGEND +
            '<ul class="trailmap">' + stops + '</ul>' +
            (mixed ? '<p class="mixed">' + (child ? 'Your child\u2019s' : 'Your') + ' trail has a bit of both: some senses get turned down and others turned up. That\u2019s very common, and the full screening explains it in detail.</p>' : '') +
          '</div>' +
          '<div class="section"><h3>' + PEAKS + '3 things to try ' + where + '</h3><ol class="tips">' + tips + '</ol></div>' +
          '<aside class="teaser" aria-labelledby="t-full"><div class="teaser__in">' +
            '<p class="kicker">This was just a sneak peek</p><h3 id="t-full">The full screening goes much further</h3>' +
            '<ul>' + adds + '</ul>' +
            '<p class="cta-lead">' + esc(child
              ? "For an in-depth screening of your child\u2019s sensory needs, click below to WhatsApp or email Occupational Therapist Cayley and purchase the full sensory screening \u2013 with tools and sensory strategies to support your child in each sensory system, together with a detailed report."
              : "For an in-depth screening of your sensory needs, click below to WhatsApp or email Occupational Therapist Cayley and purchase your full sensory screening \u2013 with tools and sensory strategies to support you in each sensory system, together with a detailed report.") + '</p>' +
            '<div class="actions">' +
              '<a class="btn btn-wa btn-block" href="' + waLink(msg) + '" target="_blank" rel="noopener noreferrer"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>WhatsApp Cayley</a>' +
              '<a class="btn btn-secondary btn-block" href="' + mailLink("Full sensory screening with Occupational Therapist Cayley – from the Sensory Snapshot", msg) + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>Email Cayley</a>' +
            '</div></div></aside>' +
          '<div class="share-row"><button type="button" class="btn btn-secondary btn-block" data-act="share"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>' + esc(shareLabel) + '</button>' +
          '<p class="toast" id="toast" role="status" aria-live="polite"></p></div>' +
          '<p class="disclaimer">This snapshot is not a diagnosis. Results are for guidance only, and your answers have not been saved or sent anywhere.</p>' +
          '<button type="button" class="restart" data-act="restart">Start again</button>' +
        '</div>' +
      '</section>';
    announce("Your results are ready: " + headline);
  }

  function share() {
    var toast = document.getElementById("toast");
    var text = state.ctx === "couple"
      ? "I just did a free 2-minute Sensory Snapshot. Take it too and let's compare how our senses work!"
      : "I just did a free 2-minute Sensory Snapshot from Soulful Sensory OT. Are you an Observer, Adaptor or Explorer?";
    var url = shareUrl();
    if (navigator.share) {
      navigator.share({ title: "Free 2-minute Sensory Snapshot", text: text, url: url }).catch(function () {});
      return;
    }
    var full = text + " " + url;
    function done() { toast.textContent = "Link copied. Paste it into a message."; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(full).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = full; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      toast.textContent = ok ? "Link copied. Paste it into a message." : "Copy this link: " + url;
    }
  }

  var advancing = false;
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "start") { state.step = "who"; render(); }
    else if (act === "ctx") { state.ctx = b.getAttribute("data-ctx"); state.idx = 0; state._lastFrac = 0; state.step = "q"; render(); }
    else if (act === "back") {
      if (state.step === "who") state.step = "welcome";
      else if (state.step === "q") { if (state.idx === 0) state.step = "who"; else state.idx--; }
      render();
    }
    else if (act === "ans") {
      if (advancing) return;
      state.answers[state.idx] = +b.getAttribute("data-v");
      app.querySelectorAll(".opt").forEach(function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
      advancing = true;
      setTimeout(function () {
        advancing = false;
        if (state.idx < QUESTIONS.length - 1) state.idx++; else state.step = "results";
        render();
      }, reduceMotion ? 60 : 260);
    }
    else if (act === "share") share();
    else if (act === "restart") { state = { step: "welcome", ctx: null, idx: 0, answers: [] }; render(); }
  });

  // Test hook for previews only (no data leaves the page): window.__snapshot.preview("work", [answers])
  window.__snapshot = { preview: function (ctx, answers) { state.ctx = ctx; state.answers = answers.slice(); state.step = "results"; render(); },
                        goto: function (ctx, idx) { state.ctx = ctx; state.idx = idx; state.step = "q"; state._lastFrac = Math.max(0, (idx - 1) / 11); render(); } };
  render();
})();
</script>
</body>
</html>
