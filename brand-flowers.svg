<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" aria-hidden="true">
  <defs>
    <style>
      .disk { fill: #f7f8f6; }
      .petal {
        fill: none;
        stroke: #3B5A6C;
        stroke-width: 1.85;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .center { fill: #3B5A6C; }
    </style>
  </defs>

  <!-- Large flower — outline only, every petal a complete closed loop -->
  <ellipse class="disk" cx="48" cy="62" rx="26" ry="25"/>
  <g class="petal" transform="translate(48 62)">
    <path d="M -1.2 -3.2
             C -3.8 -12.5 -2.2 -24.5 0.4 -29.2
             C 3.4 -24.2 3.6 -12.8 1.4 -3.4
             C 0.5 -3.1 -0.4 -3.1 -1.2 -3.2 Z"/>
    <path d="M 2.2 -2.4
             C 8.2 -11.8 17.5 -19.5 23.2 -20.8
             C 17.8 -15.2 9.4 -8.2 2.8 -2.8
             C 2.6 -2.6 2.4 -2.5 2.2 -2.4 Z"/>
    <path d="M 3.1 -0.2
             C 12.4 -3.8 23.2 -1.6 27.4 4.2
             C 19.6 3.8 10.2 2.2 3.4 0.4
             C 3.3 0.2 3.2 0 3.1 -0.2 Z"/>
    <path d="M 2.4 2.2
             C 11.2 8.8 15.8 19.2 14.2 25.8
             C 7.4 19.4 3.2 10.2 2.2 2.8
             C 2.2 2.6 2.3 2.4 2.4 2.2 Z"/>
    <path d="M 0.2 3.2
             C 2.4 13.2 1.1 24.2 -0.2 28.8
             C -2.6 23.8 -2.4 12.8 -0.6 3.4
             C -0.3 3.3 0 3.2 0.2 3.2 Z"/>
    <path d="M -2.4 2.2
             C -11.2 8.8 -15.8 19.2 -14.2 25.8
             C -7.4 19.4 -3.2 10.2 -2.2 2.8
             C -2.2 2.6 -2.3 2.4 -2.4 2.2 Z"/>
    <path d="M -3.1 -0.2
             C -12.4 -3.8 -23.2 -1.6 -27.4 4.2
             C -19.6 3.8 -10.2 2.2 -3.4 0.4
             C -3.3 0.2 -3.2 0 -3.1 -0.2 Z"/>
    <path d="M -2.2 -2.4
             C -8.2 -11.8 -17.5 -19.5 -23.2 -20.8
             C -17.8 -15.2 -9.4 -8.2 -2.8 -2.8
             C -2.6 -2.6 -2.4 -2.5 -2.2 -2.4 Z"/>
    <path d="M -0.6 -2.8
             C -5.8 -11.2 -13.2 -17.4 -18.8 -18.6
             C -12.8 -14.2 -6.4 -7.6 -1.2 -3.1
             C -1 -3 -0.8 -2.9 -0.6 -2.8 Z"/>
    <path d="M 0.6 -2.8
             C 5.8 -11.2 13.2 -17.4 18.8 -18.6
             C 12.8 -14.2 6.4 -7.6 1.2 -3.1
             C 1 -3 0.8 -2.9 0.6 -2.8 Z"/>
  </g>
  <circle class="center" cx="48" cy="62" r="2.15"/>

  <!-- Medium flower -->
  <ellipse class="disk" cx="94" cy="34" rx="19" ry="18"/>
  <g class="petal" transform="translate(94 34)">
    <path d="M -0.9 -2.4
             C -2.8 -9.4 -1.6 -17.8 0.3 -21.2
             C 2.5 -17.6 2.7 -9.6 1.1 -2.5
             C 0.4 -2.4 -0.3 -2.4 -0.9 -2.4 Z"/>
    <path d="M 1.7 -1.8
             C 6.2 -8.8 13 -14.4 17.4 -15.4
             C 13.2 -11.4 7 -6.2 2.1 -2.1
             C 2 -2 1.8 -1.9 1.7 -1.8 Z"/>
    <path d="M 2.4 -0.1
             C 9.2 -2.8 16.8 -1.1 19.8 3.2
             C 14.2 2.9 7.6 1.6 2.6 0.3
             C 2.5 0.2 2.4 0 2.4 -0.1 Z"/>
    <path d="M 1.8 1.7
             C 8.2 6.6 11.6 14.2 10.4 18.8
             C 5.4 14.2 2.4 7.6 1.7 2.2
             C 1.7 2 1.7 1.8 1.8 1.7 Z"/>
    <path d="M 0.2 2.4
             C 1.8 9.6 0.8 17.4 -0.2 20.6
             C -2 17.2 -1.8 9.4 -0.5 2.6
             C -0.2 2.5 0 2.4 0.2 2.4 Z"/>
    <path d="M -1.8 1.7
             C -8.2 6.6 -11.6 14.2 -10.4 18.8
             C -5.4 14.2 -2.4 7.6 -1.7 2.2
             C -1.7 2 -1.7 1.8 -1.8 1.7 Z"/>
    <path d="M -2.4 -0.1
             C -9.2 -2.8 -16.8 -1.1 -19.8 3.2
             C -14.2 2.9 -7.6 1.6 -2.6 0.3
             C -2.5 0.2 -2.4 0 -2.4 -0.1 Z"/>
    <path d="M -1.7 -1.8
             C -6.2 -8.8 -13 -14.4 -17.4 -15.4
             C -13.2 -11.4 -7 -6.2 -2.1 -2.1
             C -2 -2 -1.8 -1.9 -1.7 -1.8 Z"/>
  </g>
  <circle class="center" cx="94" cy="34" r="1.65"/>

  <!-- Small flower -->
  <ellipse class="disk" cx="124" cy="58" rx="13.5" ry="13"/>
  <g class="petal" transform="translate(124 58)">
    <path d="M -0.7 -1.8
             C -2 -6.8 -1.2 -12.6 0.2 -15.1
             C 1.8 -12.5 1.9 -6.9 0.8 -1.9
             C 0.3 -1.8 -0.2 -1.8 -0.7 -1.8 Z"/>
    <path d="M 1.3 -1.3
             C 4.5 -6.3 9.4 -10.3 12.6 -11
             C 9.5 -8.2 5.1 -4.5 1.6 -1.5
             C 1.5 -1.4 1.4 -1.35 1.3 -1.3 Z"/>
    <path d="M 1.8 -0.1
             C 6.6 -2 12 -0.8 14.2 2.4
             C 10.2 2.2 5.5 1.2 1.9 0.2
             C 1.85 0.1 1.82 0 1.8 -0.1 Z"/>
    <path d="M 1.3 1.3
             C 5.9 4.8 8.4 10.2 7.5 13.6
             C 3.9 10.2 1.8 5.5 1.3 1.6
             C 1.3 1.5 1.3 1.4 1.3 1.3 Z"/>
    <path d="M 0.15 1.8
             C 1.3 7 0.6 12.4 -0.15 14.8
             C -1.45 12.3 -1.3 6.9 -0.35 1.95
             C -0.15 1.9 0 1.85 0.15 1.8 Z"/>
    <path d="M -1.3 1.3
             C -5.9 4.8 -8.4 10.2 -7.5 13.6
             C -3.9 10.2 -1.8 5.5 -1.3 1.6
             C -1.3 1.5 -1.3 1.4 -1.3 1.3 Z"/>
    <path d="M -1.8 -0.1
             C -6.6 -2 -12 -0.8 -14.2 2.4
             C -10.2 2.2 -5.5 1.2 -1.9 0.2
             C -1.85 0.1 -1.82 0 -1.8 -0.1 Z"/>
    <path d="M -1.3 -1.3
             C -4.5 -6.3 -9.4 -10.3 -12.6 -11
             C -9.5 -8.2 -5.1 -4.5 -1.6 -1.5
             C -1.5 -1.4 -1.4 -1.35 -1.3 -1.3 Z"/>
  </g>
  <circle class="center" cx="124" cy="58" r="1.2"/>
</svg>
