  <!-- Soft, very gradual rolling hills -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Far gentle rise -->
    <path
      d="M-40 655
         C90 630, 180 618, 290 635
         C400 652, 500 610, 610 625
         C720 640, 820 612, 1040 630
         L1040 740 L-40 740 Z"
      fill="#c8dac9"
      fill-opacity="0.08"
      stroke="#b0c7b3"
      stroke-opacity="0.28"
      stroke-width="2"
    />
    <!-- Near gentle hills -->
    <path
      d="M-40 690
         C70 665, 160 655, 270 672
         C380 690, 470 648, 580 662
         C690 676, 790 650, 1040 668
         L1040 760 L-40 760 Z"
      fill="#bfd3c2"
      fill-opacity="0.07"
      stroke="#9eb6a1"
      stroke-opacity="0.32"
      stroke-width="2.3"
    />
    <!-- Soft inner contour -->
    <path
      d="M20 710
         C130 685, 220 675, 330 690
         C440 705, 540 668, 650 682
         C760 696, 860 670, 1000 688"
      stroke="#b0c7b3"
      stroke-opacity="0.22"
      stroke-width="1.6"
    />
  </g>
</svg>
