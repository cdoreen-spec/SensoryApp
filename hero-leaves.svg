<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f8269"/>
      <stop offset="55%" stop-color="#4a6b55"/>
      <stop offset="100%" stop-color="#3d5a47"/>
    </linearGradient>
    <linearGradient id="hLeaf1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5d9c9"/>
      <stop offset="45%" stop-color="#7b9e87"/>
      <stop offset="100%" stop-color="#3d5a47"/>
    </linearGradient>
    <linearGradient id="hLeaf2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8c4ae"/>
      <stop offset="50%" stop-color="#5f8269"/>
      <stop offset="100%" stop-color="#2f4538"/>
    </linearGradient>
    <linearGradient id="hLeaf3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#d8e8dc"/>
      <stop offset="60%" stop-color="#6b9075"/>
      <stop offset="100%" stop-color="#4a6b55"/>
    </linearGradient>
    <radialGradient id="hLight" cx="0.5" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#e8f2ea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3d5a47" stop-opacity="0"/>
    </radialGradient>
    <symbol id="rLeaf" viewBox="0 0 48 80">
      <path d="M24 2
        C12 16 6 34 10 54
        C12 62 18 72 24 78
        C30 72 36 62 38 54
        C42 34 36 16 24 2Z" fill="currentColor"/>
      <path d="M24 12 C24 30 24 50 24 72" fill="none" stroke="#1e2e24" stroke-width="1.1" stroke-opacity="0.32"/>
      <path d="M24 24 C16 28 13 34 12 40
               M24 40 C32 44 35 50 36 56
               M24 52 C17 55 14 60 13 64" fill="none" stroke="#1e2e24" stroke-width="0.8" stroke-opacity="0.25"/>
    </symbol>
  </defs>

  <rect width="900" height="320" fill="url(#hSky)"/>
  <rect width="900" height="320" fill="url(#hLight)"/>

  <!-- canopy depth -->
  <ellipse cx="120" cy="40" rx="160" ry="70" fill="#2f4538" opacity="0.35"/>
  <ellipse cx="450" cy="20" rx="220" ry="80" fill="#2a4033" opacity="0.28"/>
  <ellipse cx="780" cy="45" rx="170" ry="75" fill="#2f4538" opacity="0.32"/>

  <!-- left leaf cluster -->
  <g>
    <use href="#rLeaf" x="10" y="20" width="54" height="90" fill="url(#hLeaf1)" transform="rotate(-30 37 65)" opacity="0.92"/>
    <use href="#rLeaf" x="45" y="8" width="60" height="100" fill="url(#hLeaf2)" transform="rotate(-8 75 58)" opacity="0.9"/>
    <use href="#rLeaf" x="80" y="28" width="48" height="82" fill="url(#hLeaf3)" transform="rotate(22 104 69)" opacity="0.85"/>
    <use href="#rLeaf" x="25" y="70" width="42" height="72" fill="url(#hLeaf2)" transform="rotate(-45 46 106)" opacity="0.8"/>
    <use href="#rLeaf" x="70" y="85" width="38" height="66" fill="url(#hLeaf1)" transform="rotate(35 89 118)" opacity="0.75"/>
    <use href="#rLeaf" x="110" y="55" width="36" height="62" fill="url(#hLeaf3)" transform="rotate(48 128 86)" opacity="0.7"/>
  </g>

  <!-- center soft leaves -->
  <g opacity="0.55">
    <use href="#rLeaf" x="360" y="10" width="44" height="74" fill="url(#hLeaf3)" transform="rotate(8 382 47)"/>
    <use href="#rLeaf" x="400" y="25" width="40" height="68" fill="url(#hLeaf1)" transform="rotate(-18 420 59)"/>
    <use href="#rLeaf" x="430" y="5" width="46" height="78" fill="url(#hLeaf2)" transform="rotate(14 453 44)"/>
  </g>

  <!-- right leaf cluster -->
  <g>
    <use href="#rLeaf" x="760" y="15" width="58" height="96" fill="url(#hLeaf2)" transform="rotate(18 789 63)" opacity="0.92"/>
    <use href="#rLeaf" x="800" y="5" width="54" height="90" fill="url(#hLeaf1)" transform="rotate(32 827 50)" opacity="0.88"/>
    <use href="#rLeaf" x="735" y="40" width="46" height="78" fill="url(#hLeaf3)" transform="rotate(-12 758 79)" opacity="0.85"/>
    <use href="#rLeaf" x="820" y="55" width="40" height="70" fill="url(#hLeaf2)" transform="rotate(42 840 90)" opacity="0.78"/>
    <use href="#rLeaf" x="770" y="80" width="36" height="64" fill="url(#hLeaf1)" transform="rotate(-28 788 112)" opacity="0.72"/>
  </g>

  


  <!-- logo flowers -->
  <image href="assets/logo-flowers.png" x="120" y="55" width="120" height="86" opacity="0.95"/>
  <image href="assets/logo-flower.png" x="420" y="20" width="50" height="50" opacity="0.85"/>
  <image href="assets/logo-flowers.png" x="640" y="50" width="110" height="79" opacity="0.9"/>

  <!-- soft base shade -->
  <path d="M0 230 Q220 200 450 220 T900 210 L900 320 L0 320Z" fill="#2f4538" opacity="0.28"/>
  <path d="M0 255 Q250 230 500 248 T900 238 L900 320 L0 320Z" fill="#1e2e24" opacity="0.2"/>
</svg>
